<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixie Manga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1620;
    --bg-raised: #2c2333;
    --ink: #dce8ee;
    --ink-dim: #9b8fa8;
    --accent: #8350c4;
    --accent-soft: #7392b5;
    --line: #402b47;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans", sans-serif;
    line-height: 1.6;
  }

  header {
    text-align: center;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2rem;
  }

  header h1 {
    font-family: "Noto Serif", serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 9vw, 3.4rem);
    margin: 0;
    padding: 2.2rem 1.5rem 1.6rem;
    letter-spacing: -0.01em;
    color: #eef2f0;
  }

  .cover-thumb {
    width: calc(100% - 2.4rem);
    margin: 0 auto;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border-radius: 12px;
    border: 1px solid var(--line);
  }

  .cover-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 2.5rem 1.2rem 5rem;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1.2rem;
  }

  .section-head h2 {
    font-family: "Noto Serif", serif;
    font-weight: 700;
    font-size: 1.4rem;
    margin: 0;
  }

  .section-head span {
    font-size: 0.8rem;
    color: var(--ink-dim);
  }

  .chapter-list {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  .chapter-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.9rem 1rem;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s ease;
  }

  .chapter-card:active {
    border-color: var(--accent);
  }

  .cover {
    width: 52px;
    height: 68px;
    border-radius: 6px;
    background: linear-gradient(160deg, #402b47, #2c2333);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Noto Serif", serif;
    font-size: 1.3rem;
    color: var(--accent-soft);
    flex-shrink: 0;
  }

  .chapter-card h3 {
    margin: 0 0 0.25rem;
    font-size: 1rem;
    color: #eef2f0;
  }

  .chapter-card p {
    margin: 0;
    font-size: 0.82rem;
    color: var(--ink-dim);
  }

  .chapter-card .arrow {
    margin-left: auto;
    color: var(--accent-soft);
    font-size: 1.1rem;
  }

  footer {
    text-align: center;
    padding: 2rem 1.5rem 3rem;
    font-size: 0.82rem;
    color: var(--ink-dim);
    border-top: 1px solid var(--line);
  }

  footer a { color: var(--accent-soft); }
</style>
</head>
<body>

<header>
  <h1>PIXIE MANGA</h1>
  <div class="cover-thumb"><img src="IMG_3458.jpeg" alt="Cover"></div>
</header>

<main>
  <section>
    <div class="section-head">
      <h2>Бүлгүүд</h2>
      <span>Chapters</span>
    </div>

    <div class="chapter-list">
      <a class="chapter-card" href="chapter1.html">
        <div class="cover">01</div>
        <div>
          <h3>Бүлэг 1</h3>
          <p>Тун удахгүй</p>
        </div>
        <div class="arrow">›</div>
      </a>
    </div>
  </section>
</main>

<footer>
  Made by pixie182 · hosted with <a href="https://pages.github.com" target="_blank">GitHub Pages</a>
</footer>

</body>
</html>
